plugins {
    id 'com.android.application'
}

// ---------------------------------------------------------------------------
// Local, git-ignored configuration
// ---------------------------------------------------------------------------
// proxy.properties   -> optional default proxy values pre-filled in the UI
//                       (copy proxy.properties.example). NEVER commit it.
// keystore.properties -> release signing keystore (auto-generated by build.sh).
def loadProps = { String name ->
    def p = new Properties()
    def f = rootProject.file(name)
    if (f.exists()) f.withInputStream { p.load(it) }
    return p
}
def proxyProps = loadProps('proxy.properties')
def keystoreProps = loadProps('keystore.properties')

/** Quote a value so it can be embedded as a Java string literal in BuildConfig. */
def javaString = { String v ->
    '"' + (v ?: '').replace('\\', '\\\\').replace('"', '\\"') + '"'
}

// ABIs to build (default: arm64-v8a). Override with: -PabiFilters=arm64-v8a,armeabi-v7a,x86_64
def abiList = (project.findProperty('abiFilters') ?: 'arm64-v8a')
        .toString().split(',').collect { it.trim() }.findAll { it }

android {
    namespace 'com.vhaiup.filtervpn'
    compileSdk 36
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.vhaiup.filtervpn'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '0.1.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        buildConfigField 'String', 'DEFAULT_PROXY_HOST', javaString(proxyProps.getProperty('proxy.host', ''))
        buildConfigField 'int', 'DEFAULT_PROXY_PORT', (proxyProps.getProperty('proxy.port', '1080').trim() ?: '1080')
        buildConfigField 'String', 'DEFAULT_PROXY_USER', javaString(proxyProps.getProperty('proxy.username', ''))
        buildConfigField 'String', 'DEFAULT_PROXY_PASS', javaString(proxyProps.getProperty('proxy.password', ''))

        ndk {
            abiFilters(*abiList)
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -Wall'
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    signingConfigs {
        release {
            if (keystoreProps.getProperty('storeFile')) {
                storeFile rootProject.file(keystoreProps.getProperty('storeFile'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Use the generated release keystore if present, otherwise fall back
            // to the debug key so the APK is always installable.
            signingConfig keystoreProps.getProperty('storeFile') ? signingConfigs.release : signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.core:core:1.13.1'

    testImplementation 'junit:junit:4.13.2'
    // Real org.json for JVM unit tests (android.jar only ships stubs).
    testImplementation 'org.json:json:20240303'
}
